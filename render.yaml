# Render Blueprint for Forma Hub Lens.
#
# In Render: New > Blueprint, point it at this repo, and it reads this file.
# (Blueprints themselves cost nothing — they just create the services below.)
#
# ---------------------------------------------------------------------------
# This is configured for Render's FREE instance type, which means the cache is
# TEMPORARY. Understand this before relying on it:
#
#   * Free instances get no persistent disk. Render: files are "lost every time
#     the service redeploys, restarts, or spins down."
#   * A free service spins down after 15 minutes without traffic, and takes
#     about a minute to wake up again.
#
# So sessions, the uploaded Data Connector extract and the activity cache all
# reset on any restart or idle period. The app works — the filesystem is
# writable, unlike a serverless host — it just forgets. EPHEMERAL_STORAGE below
# makes the UI say so instead of leaving people guessing.
#
# Recovery after a wipe: sign in again, then re-ingest a completed job from the
# Extracts tab. That re-downloads from Autodesk and spends none of the hub's
# 24-jobs-per-24-hours quota.
#
# TO MAKE THE DATA STICK: set `plan: starter` and restore the disk block that is
# commented out below. Persistent disks are paid-only, and a service with a disk
# can't scale past one instance (which suits SQLite anyway).
# ---------------------------------------------------------------------------

services:
  - type: web
    name: forma-hub-lens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    autoDeploy: true

    # Returns 503 until the config is complete and the cache directory is
    # writable, so a misconfigured deploy is caught here rather than at sign-in.
    healthCheckPath: /api/health

    # Uncomment together with `plan: starter` to make data survive restarts.
    # disk:
    #   name: forma-hub-lens-data
    #   mountPath: /data
    #   sizeGB: 5   # ~100 MB per full hub extract

    envVars:
      # /data is created and made writable in the Dockerfile, so this works with
      # or without a disk mounted there. Without one it is simply temporary.
      - key: DATA_DIR
        value: /data
      # Drives the "Temporary storage" banner. Remove or set false once a
      # persistent disk is attached.
      - key: EPHEMERAL_STORAGE
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # sync: false keeps these out of the repo — set them in the Render
      # dashboard (Environment tab) when you create the service.
      - key: APS_CLIENT_ID
        sync: false
      - key: APS_CLIENT_SECRET
        sync: false
      # Must be https://<your-render-host>/api/aps/callback and must also be
      # registered as a callback URL on the APS app, or sign-in returns
      # "invalid redirect_uri". The session cookie's Secure flag keys off this.
      - key: APS_CALLBACK_URL
        sync: false
      - key: FORMA_HUB_ID
        sync: false
      # Optional: US | EMEA | AUS. Leave unset to let Autodesk route.
      - key: FORMA_REGION
        sync: false
